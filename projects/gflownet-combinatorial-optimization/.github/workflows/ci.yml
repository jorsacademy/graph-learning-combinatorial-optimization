name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}" src

      - name: Test with branch coverage
        run: pytest

      - name: End-to-end GFlowNet smoke
        run: |
          gfnco collect \
            --instances 3 --min-vertices 4 --max-vertices 5 \
            --seed 100 --output /tmp/train.jsonl
          gfnco collect \
            --instances 2 --min-vertices 4 --max-vertices 5 \
            --seed 200 --output /tmp/validation.jsonl
          gfnco train /tmp/train.jsonl \
            --validation /tmp/validation.jsonl \
            --algorithm trajectory_balance \
            --steps 2 --batch-size 1 --hidden-dim 8 --rounds 1 \
            --betas 2 4 --seed 300 \
            --checkpoint /tmp/gfn.safetensors
          gfnco train /tmp/train.jsonl \
            --validation /tmp/validation.jsonl \
            --algorithm reinforce \
            --steps 2 --batch-size 1 --hidden-dim 8 --rounds 1 \
            --betas 2 4 --seed 400 \
            --checkpoint /tmp/reinforce.safetensors
          gfnco generate \
            --vertices 5 --seed 500 --output /tmp/problem.json
          gfnco sample \
            --input /tmp/problem.json \
            --checkpoint /tmp/gfn.safetensors \
            --beta 4 --samples 8 --output /tmp/samples.json
          gfnco benchmark /tmp/validation.jsonl \
            --gflownet-checkpoint /tmp/gfn.safetensors \
            --reinforce-checkpoint /tmp/reinforce.safetensors \
            --beta 4 --samples 20 \
            --output-json /tmp/benchmark.json \
            --output-csv /tmp/benchmark.csv
