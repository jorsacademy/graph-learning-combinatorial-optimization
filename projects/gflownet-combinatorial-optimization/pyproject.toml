[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gflownet-combinatorial-optimization"
version = "0.1.0"
description = "Verification-first trajectory-balance GFlowNet benchmark for combinatorial optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "jorsacademy" }]
keywords = [
  "operations research",
  "combinatorial optimization",
  "generative flow networks",
  "gflownet",
  "independent set",
  "trajectory balance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26,<3",
  "safetensors>=0.4,<1",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
gfnco = "gfnco.cli:main"

[project.urls]
Repository = "https://github.com/jorsacademy/gflownet-combinatorial-optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=gfnco",
  "--cov-report=term-missing",
  "--cov-branch",
  "--cov-fail-under=84",
]

[tool.coverage.run]
branch = true
source = ["gfnco"]
omit = ["src/gfnco/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["gfnco"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["gfnco"]
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["safetensors", "safetensors.*"]
ignore_missing_imports = true
